plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Load keys from local.properties (never committed to Git)
def localProps = new Properties()
if (rootProject.file('local.properties').exists()) {
    localProps.load(new FileInputStream(rootProject.file('local.properties')))
}

// ── Auto-incrementing version code ───────────────────────────────────────────
// version.properties (committed to Git) stores the last version code used for a release build.
// Every `bundleRelease` / `assembleRelease` run (including Android Studio's "Generate Signed Bundle")
// bumps it by 1, so Google Play never sees the same version code twice.
// Change VERSION_NAME there when you want a new user-visible version (e.g. 1.3.0).
def versionFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def lastVersionCode = (versionProps.getProperty('VERSION_CODE') ?: '10').toInteger()
def appVersionName = versionProps.getProperty('VERSION_NAME') ?: '1.2.0'

def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().matches('.*(bundle|assemble|publish)release.*')
}
def appVersionCode = lastVersionCode
if (isReleaseBuild) {
    appVersionCode = lastVersionCode + 1
    versionProps.setProperty('VERSION_CODE', appVersionCode.toString())
    versionProps.setProperty('VERSION_NAME', appVersionName)
    versionFile.withOutputStream { versionProps.store(it, 'Updated automatically on each release build') }
    println "Release build: versionCode ${appVersionCode}, versionName ${appVersionName}"
}

android {
    namespace 'com.captionai.studio'
    compileSdk 35

    defaultConfig {
        applicationId "com.captionai.studio"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Gemini API keys injected securely from local.properties
        buildConfigField "String", "GEMINI_KEY_1", "\"${localProps.getProperty('GEMINI_KEY_1', '')}\""
        buildConfigField "String", "GEMINI_KEY_2", "\"${localProps.getProperty('GEMINI_KEY_2', '')}\""
        buildConfigField "String", "GEMINI_KEY_3", "\"${localProps.getProperty('GEMINI_KEY_3', '')}\""
        // Groq Cloud API key (Primary AI Engine) injected securely from local.properties
        buildConfigField "String", "GROQ_API_KEY", "\"${localProps.getProperty('GROQ_API_KEY', localProps.getProperty('GROK_API_KEY', ''))}\""
    }

    signingConfigs {
        release {
            if (localProps.getProperty('STORE_FILE')) {
                storeFile file(localProps.getProperty('STORE_FILE'))
                storePassword localProps.getProperty('STORE_PASSWORD', '')
                keyAlias localProps.getProperty('KEY_ALIAS', '')
                keyPassword localProps.getProperty('KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (localProps.getProperty('STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core AndroidX
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-process:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "com.google.android.material:material:1.11.0"
    
    // Jetpack Compose (The UI system)
    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:2.7.6"
    
    // Billing (In-app purchases)
    implementation "com.android.billingclient:billing-ktx:6.1.0"
    
    // Ads (Google AdMob)
    implementation "com.google.android.gms:play-services-ads:22.6.0"
    // User Messaging Platform (ad consent: GDPR / US state laws)
    implementation "com.google.android.ump:user-messaging-platform:2.2.0"
    
    // Splash Screen
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20231013"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.02.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

// Stop early (with instructions) instead of silently producing an unsigned release build
// that Google Play would reject. See RELEASE.md.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any {
        it.path.startsWith(':app:') && (it.name == 'bundleRelease' || it.name == 'assembleRelease')
    }
    if (releaseRequested) {
        if (!localProps.getProperty('STORE_FILE')) {
            throw new GradleException("Release build is not signed: STORE_FILE is missing in local.properties. Follow RELEASE.md (create a keystore and add STORE_FILE, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).")
        }
        if (!file(localProps.getProperty('STORE_FILE')).exists()) {
            throw new GradleException("Keystore file not found: ${localProps.getProperty('STORE_FILE')}. Check STORE_FILE in local.properties (use forward slashes, e.g. C:/keys/captionai.jks).")
        }
        if (!localProps.getProperty('GROQ_API_KEY') && !localProps.getProperty('GEMINI_KEY_1')) {
            logger.warn("WARNING: no GROQ_API_KEY / GEMINI_KEY_1 in local.properties - this release build will have NO built-in AI key.")
        }
    }
}
