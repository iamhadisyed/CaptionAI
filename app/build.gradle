plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Load keys from local.properties (never committed to Git)
def localProps = new Properties()
if (rootProject.file('local.properties').exists()) {
    localProps.load(new FileInputStream(rootProject.file('local.properties')))
}

android {
    namespace 'com.captionai.studio'
    compileSdk 35

    defaultConfig {
        applicationId "com.captionai.studio"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Gemini API keys injected securely from local.properties
        buildConfigField "String", "GEMINI_KEY_1", "\"${localProps.getProperty('GEMINI_KEY_1', '')}\""
        buildConfigField "String", "GEMINI_KEY_2", "\"${localProps.getProperty('GEMINI_KEY_2', '')}\""
        buildConfigField "String", "GEMINI_KEY_3", "\"${localProps.getProperty('GEMINI_KEY_3', '')}\""
        // Groq Cloud API key (Primary AI Engine) injected securely from local.properties
        buildConfigField "String", "GROQ_API_KEY", "\"${localProps.getProperty('GROQ_API_KEY', localProps.getProperty('GROK_API_KEY', ''))}\""
    }

    signingConfigs {
        release {
            if (localProps.getProperty('STORE_FILE')) {
                storeFile file(localProps.getProperty('STORE_FILE'))
                storePassword localProps.getProperty('STORE_PASSWORD', '')
                keyAlias localProps.getProperty('KEY_ALIAS', '')
                keyPassword localProps.getProperty('KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (localProps.getProperty('STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core AndroidX
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-process:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "com.google.android.material:material:1.11.0"
    
    // Jetpack Compose (The UI system)
    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:2.7.6"
    
    // Billing (In-app purchases)
    implementation "com.android.billingclient:billing-ktx:6.1.0"
    
    // Ads (Google AdMob)
    implementation "com.google.android.gms:play-services-ads:22.6.0"
    // User Messaging Platform (ad consent: GDPR / US state laws)
    implementation "com.google.android.ump:user-messaging-platform:2.2.0"
    
    // Splash Screen
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20231013"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.02.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
